name: CI/CD Pipeline - Microservice Health Monitor

on:
    push:
        branches:
            - main
            - master

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Setup Docker Build
              uses: docker/setup-buildx-action@v3

            - name: Build and Push Backend Image
              uses: docker/build-push-action@v5
              with:
                context: ./backend
                push: true
                platforms: linux/amd64,linux/arm64
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/health-backend:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/health-backend:${{ github.sha }}

            - name: Build and Push Frontend Image
              uses: docker/build-push-action@v5
              with:
                context: ./frontend
                push: true
                platforms: linux/amd64,linux/arm64
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/health-frontend:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/health-frontend:${{ github.sha }}